[project]
name = "dr-transition"
version = "0.1.0"
description = "A digital coach for Twin-Transition policy analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.2",
    "sqlalchemy>=2.0.41",
    "pymysql>=1.1.1",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.1.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "markdown>=3.8.2",
    "bleach>=6.2.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.20",
    "pypdf>=5.5.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
