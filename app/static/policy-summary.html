<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Policy Summary</title>

  <link rel="stylesheet" href="/static/css/policy-summary.css?v=20261007-dynamic" />
  <script src="/static/js/policy-summary.js?v=20261007-all-titles" defer></script>
</head>

<body>

  <main class="infographic">

    <!-- =====================================================
         HERO
    ====================================================== -->

    <header class="hero">

      <div class="hero-content">

        <div class="policy-badge">
          Selected Policy
        </div>

        <h1>
          Preparing your policy summary
        </h1>

      </div>

    </header>
    <p class="summary-status" id="summaryStatus">Your policy summary will appear here once the document has been reviewed.</p>


    <!-- =====================================================
         KEY POLICY AREAS
    ====================================================== -->

    <section class="section policy-section">

      <div class="section-heading">

        <span class="heading-bar"></span>

        <span class="heading-icon">

          <!-- Document + Leaf -->
          <svg
            viewBox="0 0 48 48"
            fill="none"
            stroke="#ffffff"
            stroke-width="2.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 6h18l7 7v28H12z" />
            <path d="M30 6v8h7" />

            <path d="M18 20h12" />
            <path d="M18 26h9" />

            <path
              d="M28 36
                 C31 30 36 28 41 29
                 C40 35 36 39 30 39
                 C28 39 27 38 28 36Z"
            />

            <path d="M29 37c3-3 6-5 10-7" />
          </svg>

        </span>

        <h2>Key policy areas</h2>

      </div>


      <div class="items policy-items"></div>

    </section>


    <!-- =====================================================
         HOW THE POLICY WORKS
    ====================================================== -->

    <section class="section works-section">

      <div class="section-heading">

        <span class="heading-bar"></span>

        <span class="heading-icon">

          <!-- Accurate Gear Pair -->
          <svg
            viewBox="0 0 48 48"
            fill="none"
            stroke="#ffffff"
            stroke-width="2.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >

            <circle cx="30" cy="17" r="7" />
            <circle cx="30" cy="17" r="2.5" />

            <path d="M30 6v4" />
            <path d="M30 24v4" />
            <path d="M19 17h4" />
            <path d="M37 17h4" />

            <path d="M22 9l3 3" />
            <path d="M35 22l3 3" />
            <path d="M38 9l-3 3" />
            <path d="M25 22l-3 3" />


            <circle cx="16" cy="31" r="6" />
            <circle cx="16" cy="31" r="2" />

            <path d="M16 22v3" />
            <path d="M16 37v3" />
            <path d="M7 31h3" />
            <path d="M22 31h3" />

            <path d="M10 25l2 2" />
            <path d="M20 35l2 2" />
            <path d="M22 25l-2 2" />
            <path d="M12 35l-2 2" />

          </svg>

        </span>

        <h2>How the policy works</h2>

      </div>


      <div class="items works-items"></div>

    </section>


    <!-- =====================================================
         INTENDED BENEFITS
    ====================================================== -->

    <section class="section benefits-section">

      <div class="section-heading">

        <span class="heading-bar"></span>

        <span class="heading-icon">

          <!-- Target -->
          <svg
            viewBox="0 0 48 48"
            fill="none"
            stroke="#ffffff"
            stroke-width="2.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >

            <circle cx="22" cy="26" r="15" />
            <circle cx="22" cy="26" r="9" />
            <circle cx="22" cy="26" r="3" />

            <path d="M24 24L39 9" />
            <path d="M32 9h7v7" />

          </svg>

        </span>

        <h2>Intended benefits</h2>

      </div>


      <div class="items benefit-items"></div>

    </section>


    <!-- =====================================================
         BENEFITING PEOPLE
    ====================================================== -->

    <section class="section people-section">

      <div class="section-heading">

        <span class="heading-bar"></span>

        <span class="heading-icon">

          <!-- People / Community -->
          <svg
            viewBox="0 0 48 48"
            fill="#ffffff"
            aria-hidden="true"
          >

            <circle cx="24" cy="15" r="6" />
            <circle cx="11" cy="20" r="5" />
            <circle cx="37" cy="20" r="5" />

            <path
              d="M14 40v-5
                 c0-8 4-12 10-12
                 s10 4 10 12v5z"
            />

            <path
              d="M3 39v-5
                 c0-6 3-9 8-9
                 c2 0 4 1 5 2
                 c-3 3-4 7-4 12z"
            />

            <path
              d="M36 39
                 c0-5-1-9-4-12
                 c1-1 3-2 5-2
                 c5 0 8 3 8 9v5z"
            />

          </svg>

        </span>

        <h2>Benefiting people and groups</h2>

      </div>


      <div class="items people-items"></div>

    </section>

  </main>

</body>
</html>
